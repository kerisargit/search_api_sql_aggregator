services:
  # '@?' handler: NULL unless the _unsafe submodule is installed.
  search_api_sql_aggregator.validator:
    class: Drupal\search_api_sql_aggregator\Service\OperationValidator
    arguments: ['@database', '@logger.factory', '@entity_type.manager', '@keyvalue', '@?plugin.manager.search_api.data_type', '@?search_api_sql_aggregator_unsafe.handler']

  search_api_sql_aggregator.manager:
    class: Drupal\search_api_sql_aggregator\Service\AggregationManager
    arguments: ['@database', '@logger.factory', '@state', '@lock', '@entity_type.manager', '@search_api_sql_aggregator.validator', '@?search_api_sql_aggregator_unsafe.handler']
  search_api_sql_aggregator.aggregation_task:
    class: Drupal\search_api_sql_aggregator\IntervalTask\AggregationTask
    arguments: ['@config.factory', '@state', '@search_api_sql_aggregator.manager', '@datetime.time']
    tags:
      - { name: interval_trigger.task }
  search_api_sql_aggregator.index_complete_subscriber:
    class: Drupal\search_api_sql_aggregator\EventSubscriber\IndexCompleteAggregationSubscriber
    arguments: ['@config.factory', '@search_api_sql_aggregator.manager', '@logger.factory']
    tags:
      - { name: event_subscriber }