administer sql aggregator:
  title: 'Администрирование SQL Агрегатора'
  description: 'Доступ к странице настроек: построение конфигурации, запуск безопасных операций (aggregate, copy, null_reset, fill_from_union, priority_fill), просмотр отчётов.'
  restrict access: true

use sql aggregator custom sql:
  title: 'SQL Агрегатор: произвольный SQL (Custom SQL)'
  description: 'Разрешает операции Custom SQL: чтение не ограничено, единственная цель записи (если она есть) проверяется по белому списку таблиц Search API — это защита от опечатки, а не надёжная граница. Само по себе это право НЕДОСТАТОЧНО для выполнения: по умолчанию выключено на уровне сервера и требует свою пару ключей в settings.php (см. страницу справки модуля). Выдавайте только полностью доверенным администраторам.'
  restrict access: true
